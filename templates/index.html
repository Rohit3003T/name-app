<!DOCTYPE html>
<html>
<head>
    <title>Name App</title>
</head>

<body>

    <h1>Name App</h1>

    <p>Your IP: {{ client_ip }}</p>

    <form method="POST">
        <input
            type="text"
            name="name"
            placeholder="Enter your name"
            required
        >
        <button type="submit">Submit</button>
    </form>

    <h2>Names</h2>

    <ul>
        {% for name in names %}
            <li>{{ name[0] }}</li>
        {% endfor %}
    </ul>

</body>
</html>
