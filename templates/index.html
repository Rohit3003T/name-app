
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Name App</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        .container {
            width: 90%;
            max-width: 650px;
            margin: 60px auto;
        }

        h1 {
            margin-bottom: 6px;
            font-size: 30px;
        }

        .description {
            color: #666;
            margin-top: 0;
            margin-bottom: 30px;
        }

        .form {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            background: #222;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        .info {
            font-size: 14px;
            color: #777;
            margin-bottom: 30px;
        }

        .names {
            background: white;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 20px;
        }

        .names h2 {
            margin-top: 0;
            font-size: 19px;
        }

        ul {
            margin: 0;
            padding-left: 20px;
        }

        li {
            padding: 7px 0;
            border-bottom: 1px solid #eee;
        }

        li:last-child {
            border-bottom: none;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Name App</h1>
        <p class="description">
            A simple Flask application deployed on AWS.
        </p>

        <form method="POST" class="form">
            <input
                type="text"
                name="name"
                placeholder="Enter your name"
                required
            >
            <button type="submit">Submit</button>
        </form>

        <div class="info">
            Your IP: {{ client_ip }}
        </div>

        <div class="names">
            <h2>Submitted Names</h2>

            <ul>
                {% for name in names %}
                    <li>{{ name[0] }}</li>
                {% else %}
                    <li>No names submitted yet.</li>
                {% endfor %}
            </ul>
        </div>

    </div>

</body>
</html>
